name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats, stack and activity
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git push
          fi
