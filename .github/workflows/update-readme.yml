name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: [profile.json, scripts/**, .github/workflows/update-readme.yml]

permissions:
  contents: write

concurrency: update-profile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats, stack and activity
        run: python scripts/build_profile.py
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT with read:user + repo) to include private work
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || { git commit -m "chore: refresh profile"; git push; }
